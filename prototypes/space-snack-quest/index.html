  const o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, when);

  o.connect(g).connect(audio.out); o.start(when); o.stop(when + dur);

// An original pentatonic phrase. Not a known song.

function maskedHall() {
  if (hallMasked) return hallMasked;
  const img = rooms.hall;
  if (!img || !img.complete || !img.naturalWidth) return null;
  const c = document.createElement('canvas');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0);
  const frame = g.getImageData(0, 0, c.width, c.height);
  const d = frame.data;
  const w = c.width;
  const yellow = i => {
    const r = d[i], gch = d[i + 1], b = d[i + 2];
    return r > 210 && gch > 150 && gch < 240 && b < 110 && r - b > 110;
  };
  for (let y = 300; y < 720 && y < c.height; y++) {
    for (let x = 1000; x < 1260 && x < w; x++) {
      const i = (y * w + x) * 4;
      if (!yellow(i)) continue;
      let nr = d[i], ng = d[i + 1], nb = d[i + 2];
      for (const [dx, dy] of [[-8, 0], [8, 0], [0, -8], [0, 8]]) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= c.height) continue;
        const j = (yy * w + xx) * 4;
        if (!yellow(j)) { nr = d[j]; ng = d[j + 1]; nb = d[j + 2]; break; }
      }
      d[i] = nr; d[i + 1] = ng; d[i + 2] = nb;
    }
  }
  g.putImageData(frame, 0, 0);

  return c;
}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function beardMop(dt) {

function walkToward(p, tx, ty, dt, free) {
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
  if (d < 4) { p.moving = false; return true; }
  const step = Math.min(d, tune.walk_speed * dt);
  p.face = dx < -1 ? -1 : dx > 1 ? 1 : p.face;
  p.moving = true;
  p.walk += dt * 9;
  const nx = p.x + (dx / d) * step, ny = p.y + (dy / d) * step;
  const block = free ? () => false : blocker();
  if (!block(nx, ny)) { p.x = nx; p.y = ny; }
  else if (!block(nx, p.y)) p.x = nx;
  else if (!block(p.x, ny)) p.y = ny;

}

function inCone(px, py, ox, oy, face, half, len) {
  const dx = px - ox, dy = py - oy, d = Math.hypot(dx, dy);

  return Math.abs(angNorm(Math.atan2(dy, dx) - face)) < half;
}
function lookNow() {

  const cyc = away + turn + look + turn;
  const u = state.lookT % cyc;
  const up = -Math.PI / 2, left = Math.PI - 0.55;
  if (u < away) return { mode: 'away', face: up };
  if (u < away + turn) return { mode: 'turn', face: up + angNorm(left - up) * ((u - away) / turn) };
  if (u < away + turn + look) return { mode: 'look', face: left };
  const k = (u - away - turn - look) / turn;
  return { mode: 'turn', face: left + angNorm(up - left) * k };
}

function advanceStory() {
  if (state.beat === 'resort') { state.beat = 'intro'; blip(); return; }
  if (state.beat === 'intro') {
    state.beat = 'asleep';
    state.asleepT = 0;
    state.song = 'off';
    state.sq.x = 190; state.sq.y = 520; state.sq.face = 1;
    state.mo.x = 640; state.mo.y = 540; state.mo.face = 1;
    return;
  }
  if (state.beat === 'wake') { state.beat = 'partyq'; state.sq.y = 500; blip(); return; }
  if (state.beat === 'partyq') { state.beat = 'mophello'; state.mo.face = -1; state.mo.x = 680; blip(); return; }
  if (state.beat === 'mophello') { state.beat = 'wring'; state.wringT = 0; blip(); return; }
  if (state.beat === 'wring') { state.beat = 'zylan'; state.songOn = true; blip(); return; }
  if (state.beat === 'zylan') { state.beat = 'hopout'; state.hopOut = 0; return; }
  if (state.beat === 'oursong') { state.beat = 'sing'; state.control = true; blip(); return; }
  if (state.beat === 'work') { state.beat = 'partyagain'; blip(); return; }
  if (state.beat === 'partyagain') { state.beat = 'stay'; state.mo.face = state.sq.x < state.mo.x ? -1 : 1; blip(); return; }
  if (state.beat === 'song') {
    state.line++;
    if (state.line >= 2) {
      state.beat = 'work';
      state.mo.sing = false;
      state.sq.sing = false;
      state.songOn = true;
      state.mo.face = state.sq.x < state.mo.x ? -1 : 1;
    } else { blip(); goodbyeNotes('mops'); state.sq.sing = false; state.mo.sing = true; }
    return;
  }
  if (state.beat === 'stay') { state.beat = 'leave'; return; }
  if (state.beat === 'evening') { state.beat = 'peekready'; return; }
  if (state.beat === 'jail') {
    if (state.chaseJail) { state.chaseJail = false; restartChase(); }
    else if (state.searchJail) { state.searchJail = false; restartSearch(); }
    else if (state.backHome) restartBack();
    else restartSneak();
    return;
  }
}

  // is only the evening sneak (enterSneak). The old goodbye walked Mops to
  // (930, 500) with the walls turned off, and treated x > 890 as "he is gone".
  // The right wall of this picture is about x=925, so that walk carried him
  // through the wall and off the picture. The hall is a different picture and
  // was not drawn yet, but he had already left the room, and the next place
  // the player stands is that hall.
  const hallBeat = ['peek', 'sneak', 'hop', 'hidden', 'jail', 'announce', 'poster', 'band', 'groove', 'wish', 'sneakback', 'approach', 'dance', 'shed', 'pull', 'alert', 'chase'].includes(state.beat);
  if (!hallBeat) state.room = 'home';
  if (state.beat === 'alone' && state.look === 'bedline') {
    state.flopT += dt;
    if (state.flopT > 0.9) state.look = 'bedline';
  }
  if (state.beat === 'homework') state.hwT += dt;
  syncTune();
  if (state.beat === 'evening' || state.beat === 'peekready') pumpParty();
  if (state.beat === 'asleep') {
    state.asleepT += dt;
    beardMop(dt);
    if (state.asleepT > 1.4) state.beat = 'wake';
  }
  if (state.beat === 'wake' || state.beat === 'partyq') beardMop(dt);

    state.sq.x = 190 + Math.min(1, state.hopOut / 0.7) * 180;

  }
  if (state.beat === 'songwalk') {
    const a = walkToward(state.mo, 800, 490, dt);
    const b = walkToward(state.sq, 600, 460, dt);
    state.mo.face = -1; state.sq.face = 1;
    if (a && b) {

      state.sq.sing = true; state.mo.sing = false;

  }
  if (state.beat === 'leave') {
    state.mo.face = 1; state.mo.sing = false;
    // Just inside the right-wall doorway, still on the bedroom floor.
    if (walkToward(state.mo, 820, 500, dt)) {
      state.mo.hidden = true;
      state.beat = 'alone';
      state.step = 0;
      state.look = '';
      state.songOn = true;
    }

      state.dim = true;
      state.sq.x = DOOR.x; state.sq.y = DOOR.y;

  if (cue === 'notes') say('♪', s.x - 18, s.y + 16, 22, INK, 'center', 800);
  ctx.restore();

}
let roomTune = null, tuneFailed = false;
function syncTune() {
  if (tuneFailed || !state.songOn || state.room !== 'home') {
    if (roomTune && roomTune.pause) roomTune.pause();
    return;
  }
  if (!roomTune) {
    roomTune = new Audio('assets/approved/floating-in-space.mp3');
    roomTune.loop = true;
    roomTune.addEventListener('error', () => { tuneFailed = true; });
  }
  roomTune.volume = state.beat === 'song' ? 0.05 : 0.22;
  const play = roomTune.play && roomTune.play();
  if (play && play.catch) play.catch(() => {});
}
let partyNext = 0;
function pumpParty() {
  if (!audio) return;
  const now = audio.ac.currentTime;
  if (partyNext > now) return;
  partyNext = now + 0.45;
  toneAt(130 + (Math.floor(state.t * 3) % 4) * 20, now, 0.28, 'triangle', 0.025);
}
function currentLine() {
  if (state.beat === 'resort') return { kind: 'card', text: LINE.resort };
  if (state.beat === 'intro') return { kind: 'card', text: LINE.intro };
  if (state.beat === 'wake') return { kind: 'line', who: 'speaker', text: LINE.morning[1] };
  if (state.beat === 'partyq') return { kind: 'line', who: 'sq', text: 'Party?' };
  if (state.beat === 'mophello') return { kind: 'line', who: 'mops', text: 'Morning, Squatch.' };
  if (state.beat === 'wring') return { kind: 'wring' };
  if (state.beat === 'zylan') return { kind: 'line', who: 'speaker', text: LINE.morning[3] };
  if (state.beat === 'oursong') return { kind: 'line', who: 'mops', text: LINE.oursong };
  if (state.beat === 'work') return { kind: 'line', who: 'mops', text: LINE.work };
  if (state.beat === 'partyagain') return { kind: 'line', who: 'mops', text: LINE.partyAgain };
  if (state.beat === 'stay') return { kind: 'line', who: 'mops', text: LINE.stay };
  if (state.beat === 'song' && state.line === 0) return { kind: 'line', who: 'sq', text: LINE.sqSong };
  if (state.beat === 'song') return { kind: 'line', who: 'mops', text: LINE.moSong };
  if (state.beat === 'alone' && state.look === 'closet') return { kind: 'line', who: 'sq', text: LINE.closet };
  if (state.beat === 'alone' && state.look === 'bedline') return { kind: 'line', who: 'sq', text: LINE.bed };
  if (state.beat === 'alone' && state.look === 'calendar') return { kind: 'calendar' };
  if (state.beat === 'evening') return { kind: 'evening' };
  if (state.beat === 'peek' && state.line === 0) return { kind: 'line', who: 'isfred', text: LINE.mumble };
  if (state.beat === 'peek') return { kind: 'line', who: 'sq', text: LINE.robots };
  if (state.beat === 'announce') return { kind: 'line', who: 'isfred', text: [LINE.welcome, LINE.hello, LINE.soon][state.line] || LINE.soon };
  if (state.beat === 'poster') return { kind: 'poster' };
  if (state.beat === 'band') return { kind: 'line', who: 'isfred', text: LINE.croc };
  if (state.beat === 'wish') return { kind: 'line', who: 'thought', text: LINE.wish };
  if (state.beat === 'shed') return { kind: 'line', who: 'witness', text: LINE.fur };
  if (state.beat === 'alert') return { kind: 'line', who: 'witness', text: LINE.alarm };
  if (state.beat === 'miss') return { kind: 'line', who: 'sq', text: LINE.someone };
  if (state.beat === 'have') return { kind: 'line', who: 'mops', text: LINE.have };
  if (state.beat === 'bedtime') return { kind: 'line', who: 'mops', text: state.line === 0 ? LINE.crate : LINE.loved };

}
function headFor(who) {
  return state.heads.find(h => h.who === who) || state.heads[0];
}
function drawIsfred(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  roundRect(-8, -18, 6, 16, 2); ctx.fillStyle = '#59657d'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
  roundRect(2, -18, 6, 16, 2); ctx.fill(); ctx.stroke();
  roundRect(-14, -46, 28, 30, 8); ctx.fillStyle = '#7a4ad0'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -56, 11, 0, Math.PI * 2); ctx.fillStyle = '#f0bf93'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -62, 11, Math.PI, 0); ctx.fillStyle = '#5b2d9e'; ctx.fill();
  ctx.beginPath(); ctx.arc(-4, -57, 1.5, 0, 7); ctx.fillStyle = INK; ctx.fill();
  ctx.beginPath(); ctx.arc(4, -57, 1.5, 0, 7); ctx.fill();
  ctx.restore();
  state.heads.push({ x: x - 14 * scale, y: y - 70 * scale, w: 28 * scale, h: 26 * scale, who: 'isfred' });
}
function drawBand(x, y, scale, face) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * (face < 0 ? -1 : 1), scale);
  roundRect(-6, -18, 5, 16, 2); ctx.fillStyle = '#3d4454'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.stroke();
  roundRect(2, -18, 5, 16, 2); ctx.fill(); ctx.stroke();
  roundRect(-14, -48, 28, 32, 8); ctx.fillStyle = '#3f8f4a'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -58, 12, 0, Math.PI * 2); ctx.fillStyle = '#b6e7a8'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(16, -56, 12, 5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#2f7a3a'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(-4, -60, 1.4, 0, 7); ctx.fillStyle = INK; ctx.fill();
  ctx.restore();
}
function drawPoster() {
  const box = { x: 600, y: 150, w: 210, h: 200 };
  roundRect(box.x, box.y, box.w, box.h, 12);
  ctx.fillStyle = '#fffaf0'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  [[40, 36, '#c9b6f2', 46], [80, 28, '#9fd0ff', 54], [120, 44, '#ffcf33', 38]].forEach(([dx, dy, color, h]) => {
    roundRect(box.x + dx, box.y + dy, 36, h, 6);

  say(LINE.poster, box.x + box.w / 2, box.y + box.h - 28, 20, '#e5533d', 'center', 800);
  state.controls.push({ id: 'card', x: box.x, y: box.y, w: box.w, h: box.h, lit: true });
}
function drawClothes() {
  PIECES.forEach((piece, i) => {
    if (state.worn.includes(piece.name)) return;
    if (drag && drag.name === piece.name) return;
    const h = pieceHome(i);
    drawPieceIcon(piece.name, h.x, h.y, 1.4);
    say(piece.name, h.x, h.y + 28, 14, INK, 'center', 700);
  });
  if (drag) drawPieceIcon(drag.name, drag.x, drag.y, 1.6);
}
function drawWorn(x, y, scale) {
  if (!state.worn || !state.worn.length || state.hidden) return;
  const s = scale || 1;
  ctx.save();
  ctx.fillStyle = '#1e2430';
  ctx.strokeStyle = INK;
  if (state.worn.includes('top hat')) {
    roundRect(x - 10 * s, y - 50 * s, 20 * s, 5 * s, 2);
    ctx.fill();
    roundRect(x - 6 * s, y - 62 * s, 12 * s, 13 * s, 2);
    ctx.fill();
  }
  if (state.worn.includes('sunglasses')) {
    ctx.beginPath();
    ctx.ellipse(x - 6 * s, y - 30 * s, 3 * s, 2 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 6 * s, y - 30 * s, 3 * s, 2 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = Math.max(1, s * 0.6);
    ctx.beginPath();
    ctx.moveTo(x - 3 * s, y - 30 * s);
    ctx.lineTo(x + 3 * s, y - 30 * s);
    ctx.stroke();
  }
  if (state.worn.includes('shirt')) {
    ctx.fillStyle = '#3478f6';
    roundRect(x - 11 * s, y - 24 * s, 22 * s, 12 * s, 3);
    ctx.fill();
    ctx.lineWidth = 1.5; ctx.stroke();
  }
  if (state.worn.includes('boots')) {
    ctx.fillStyle = '#6b4428';
    ctx.fillRect(x - 8 * s, y - 6 * s, 6 * s, 6 * s);
    ctx.fillRect(x + 2 * s, y - 6 * s, 6 * s, 6 * s);

}
function drawDance() {
  const dir = DANCE[state.line % DANCE.length];
  const x = 560, y = 470;
  ctx.beginPath();
  ctx.arc(x, y, 54, 0, Math.PI * 2);
  ctx.fillStyle = '#fff4cc';
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#e09000';
  ctx.stroke();
  ctx.beginPath();
  const a = { L: Math.PI, R: 0, U: -Math.PI / 2, D: Math.PI / 2 }[dir];
  ctx.moveTo(x + Math.cos(a) * 22, y + Math.sin(a) * 22);
  ctx.lineTo(x - Math.cos(a) * 12 + Math.cos(a + 2.2) * 12, y - Math.sin(a) * 12 + Math.sin(a + 2.2) * 12);
  ctx.lineTo(x - Math.cos(a) * 12 + Math.cos(a - 2.2) * 12, y - Math.sin(a) * 12 + Math.sin(a - 2.2) * 12);
  ctx.closePath();
  ctx.fillStyle = INK;
  ctx.fill();

let growl = null;
function playGrowl() {
  if (muted) return;
  if (!growl) {
    growl = new Audio('assets/approved/nick1-wookiee.mp3');
    growl.volume = 0.45;
  }
  growl.currentTime = 0;
  const playing = growl.play && growl.play();
  if (playing && playing.catch) playing.catch(() => {});
}
function drawTv() {
  clear('#10141c');
  roundRect(120, 60, 720, 500, 18);
  ctx.fillStyle = '#d7ecf5'; ctx.fill();
  ctx.lineWidth = 8; ctx.strokeStyle = '#1e2430'; ctx.stroke();
  if (state.line === 0) {
    drawSquatch(340, 400, 1.7, { face: 1 });
    drawSquatch(560, 410, 1.55, { face: -1 });
    say(LINE.scrubber, 480, 130, 28, INK, 'center', 800);
  } else if (state.line === 1) {
    drawGuest(430, 420, 1.3, 'teal', 1);
    say('!', 620, 220, 80, '#e5533d', 'center', 900);
  } else {
    drawIsfred(320, 400, 1.8);
    drawSquatch(580, 420, 1.5, { face: -1 });

  }

}
function drawPlay() {
  if (state.beat === 'tv' || state.beat === 'wring') {
    if (state.beat === 'tv') drawTv();
    else drawWring();
    drawIconButtons();
    return;
  }
  if (state.beat === 'resort') {
    clear('#1b2436');
    drawCard(LINE.resort, '', true);
    drawIconButtons();
    return;
  }
  drawRoom(state.room === 'hall' ? 'hall' : 'home');
  if (state.room === 'hall') drawBanner();
  if (state.beat === 'peek' || state.beat === 'sneak' || state.beat === 'hop' || state.beat === 'hidden' || state.beat === 'jail') drawPlanterHint();
  drawPeople();
  if (state.dim) { ctx.fillStyle = 'rgba(8, 10, 18, 0.18)'; ctx.fillRect(0, 0, W, H); }
  if (state.beat === 'wish') state.heads.push({ x: EYE_PAIR.x - 18, y: EYE_PAIR.y - 20, w: 36, h: 20, who: 'thought' });
  if ((state.beat === 'shed' || state.beat === 'alert' || state.beat === 'pull') && state.beat !== 'pull') {
    const wx = state.witness ? state.witness.x : 640;
    const wy = state.witness ? state.witness.y : 500;
    state.heads.push({ x: wx - 20, y: wy - 80, w: 40, h: 30, who: 'witness' });
  }
  if (state.beat === 'shed') state.heads.push({ x: 620, y: 430, w: 40, h: 30, who: 'witness' });
  if (state.beat === 'gloves' || state.beat === 'furryline') state.heads.push({ x: 600, y: 430, w: 50, h: 40, who: 'bar' });
  drawSparks();
  const line = currentLine();
  if (line && (line.kind === 'card' || line.kind === 'intro')) {
    const g = ctx.createRadialGradient(state.sq.x, state.sq.y - 70, 80, state.sq.x, state.sq.y - 40, 280);
    g.addColorStop(0, 'rgba(12,16,28,0)');
    g.addColorStop(1, 'rgba(12,16,28,0.62)');

  if (state.beat === 'sing') drawChip('SING ALONG', true);

  if (state.beat === 'dress') drawClothes();
  if (state.beat === 'snack') state.controls.push({ id: 'line', x: 720, y: 430, w: 70, h: 80, lit: true });

}
function drawTitle() {

  }
  say(TITLE, W / 2, 78, 46, '#fff8ee', 'center', 800);
  const pulse = 0.5 + 0.5 * Math.sin(state.t * 3);
  ctx.save();
  ctx.shadowColor = '#ffcf33';
  ctx.shadowBlur = 16 + 18 * pulse;
  roundRect(250, 200, 460, 280, 28);
  ctx.strokeStyle = '#ffcf33'; ctx.lineWidth = 6; ctx.stroke();
  ctx.restore();
  drawSquatch(380, 430, 2.5, { face: 1, walk: state.t * 6 });
  drawMops(600, 440, 2.2, { face: -1, walk: state.t * 5, sway: Math.sin(state.t * 2) * 0.04 });

  ctx.beginPath(); ctx.moveTo(470, 250); ctx.lineTo(470, 300); ctx.lineTo(512, 275); ctx.closePath(); ctx.fill();
  state.controls.push({ id: 'start', x: 250, y: 200, w: 460, h: 280, lit: true });
  state.hint = null;
}

function drawLineup() {
  clear('#f4f1ea');
  const names = ['Teal jacket', 'Camera', 'Backpack', 'Stilts', 'Octopus', 'Robot'];
  GUESTS.forEach((kind, i) => {
    const x = 110 + i * 145;
    drawGuest(x, 500, 1, kind, 1);
    say(names[i], x, 540, 18, INK, 'center', 700);
  });
}

// ---- Scenes ----------------------------------------------------------------------------
const scenes = {
  lineup: { update(dt) { state.t += dt; }, draw: drawLineup },
  title: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space')) { beginStory(); scene = 'play'; } },
    draw: drawTitle,
  },
  play: {
    update(dt) {
      state.t += dt;
      if (pressed('KeyP')) state.paused = !state.paused;
      if (pressed('KeyM')) setMuted(!muted);
      if (pressed('Enter') || pressed('Space')) activateKey();
      tickWorld(dt);
    },
    draw: drawPlay,
  },
};

// ---- Loop ------------------------------------------------------------------------------
function step() {
  if (pendingTap) { const p = pendingTap; pendingTap = null; onTap(p); }

}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;

}
function drawFrame() {
  state.words = [];

  state.heads = [];
  state.cones = [];
  state.controls = [];
  state.guests = [];
  state.hint = null;
  state.eyes = [];
  state.mopProp = false;

  ctx.fillText = orig;

}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  inCone, PLANTER, BUSH_OUTLINE, LEAF, EYES, POT, DOOR, WATCH_FEET, watchEyes, LINE, GUESTS, HOME, SPEAKER, PIECES, pieceHome, dressZones,
  roomsReady() {
    const imgs = [...Object.values(rooms), ...Object.values(guestSprites), speakerImg, mopsImg];
    return imgs.every(img => img.complete && img.naturalWidth);
  },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
if (scene === 'play') beginStory();
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
