name: Opening playthrough

on:
  push:
  pull_request:

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Puppeteer
        run: npm install --prefix /tmp/pw puppeteer
      - name: Tap through the seven opening beats
        run: PUPPETEER_ENTRY=/tmp/pw/node_modules/puppeteer/lib/puppeteer/puppeteer.js node tests/opening-playthrough.mjs
